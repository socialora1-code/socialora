name: Socialora Tools Build Check

on:
  push:
    branches: [main]
    paths:
      - 'app/tools/**'
      - 'components/tools/**'
      - 'lib/tool-list.ts'
      - 'lib/tool-data/**'
      - '.github/workflows/socialora-tools-build.yml'
  pull_request:
    paths:
      - 'app/tools/**'
      - 'components/tools/**'
      - 'lib/tool-list.ts'
      - 'lib/tool-data/**'
      - '.github/workflows/socialora-tools-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialora-tools-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install exactly the lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check and build Next.js
        run: pnpm build

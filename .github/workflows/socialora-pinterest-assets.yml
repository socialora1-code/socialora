name: Socialora Pinterest Visual Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "8 1 * * *"
  push:
    paths:
      - automation/pinterest/build_visual_assets.py
      - automation/pinterest/growth-playbook.md
      - .github/workflows/socialora-pinterest-assets.yml

permissions:
  contents: write

concurrency:
  group: socialora-pinterest-assets-main
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check for unpublished draft assets
        id: needed
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          import re
          from urllib.parse import urlsplit, urlunsplit
          queue=json.loads(Path("automation/pinterest/content-queue.json").read_text())
          code=Path("automation/pinterest/build_visual_assets.py").read_text()
          version=re.search(r'^RENDERER_VERSION = "([^"]+)"',code,re.M).group(1)
          manifest_path=Path("public/pinterest/visual-manifest.json")
          manifest=json.loads(manifest_path.read_text()) if manifest_path.exists() else {}
          missing=[]
          for p in queue["pins"]:
              if p.get("status")!="draft":
                  continue
              source=urlsplit(p["url"])
              clean=urlunsplit((source.scheme,source.netloc,source.path,"",""))
              item=manifest.get(p["id"],{})
              if not Path("public/pinterest/"+p["id"]+".png").exists() or item.get("renderer_version")!=version or item.get("cover_hook")!=p.get("cover_hook") or item.get("source_url")!=clean:
                  missing.append(p["id"])
          print("needed="+("yes" if missing else "no"))
          print("count="+str(len(missing)))
          PY
      - name: Install screenshot and image tools
        if: steps.needed.outputs.needed == 'yes'
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture and compose verified premium images
        if: steps.needed.outputs.needed == 'yes'
        run: python automation/pinterest/build_visual_assets.py --limit 30
      - name: Commit images only (never publish Pins)
        if: steps.needed.outputs.needed == 'yes'
        run: |
          git config user.name "socialora-asset-bot"
          git config user.email "socialora-asset-bot@users.noreply.github.com"
          git add public/pinterest/
          if git diff --cached --quiet; then
            echo "No validated images to commit."
            exit 0
          fi
          git commit -m "assets(pinterest): verified tool screenshots and premium pin covers"
          git pull --rebase origin main
          git push origin HEAD:main
